# Arcane / Proxmox Ubuntu VM stack (with Web UI)
#
# 1. Pass optical drive from Proxmox host to VM (see docs/proxmox.md).
# 2. Create data dir: sudo mkdir -p /opt/album-dvd-burner && sudo chown $USER /opt/album-dvd-burner
# 3. Copy .env.example → .env and set POSTGRES_PASSWORD, DVD_DEVICE, DATA_ROOT.
# 4. Deploy in Arcane with this compose file.
# 5. Open http://<vm-ip>:8080

services:
  postgres:
    image: postgres:16-alpine
    container_name: album-dvd-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-album_dvd}
      POSTGRES_USER: ${POSTGRES_USER:-album_dvd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-album_dvd} -d ${POSTGRES_DB:-album_dvd}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: album-dvd-burner:latest
    container_name: album-dvd-web
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-album_dvd}
      POSTGRES_USER: ${POSTGRES_USER:-album_dvd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DVD_DEVICE: ${DVD_DEVICE:-/dev/sr0}
      DVD_STANDARD: ${DVD_STANDARD:-ntsc}
      DATA_ROOT: /data
      BURN_ID_PREFIX: ${BURN_ID_PREFIX:-R.P. No.}
      WEB_API_KEY: ${WEB_API_KEY:-}
      RETENTION_DELAY_HOURS: ${RETENTION_DELAY_HOURS:-3}
      WEB_PORT: 8080
    volumes:
      - ${DATA_ROOT:-/opt/album-dvd-burner}:/data
    devices:
      - "${DVD_DEVICE:-/dev/sr0}:${DVD_DEVICE:-/dev/sr0}"
    privileged: true
    restart: unless-stopped

volumes:
  pgdata:
