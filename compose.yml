services:
  web:
    image: ghcr.io/obievousky/album-dvd-burner:${APP_VERSION:-latest}
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Dedicated, non-root application account. Provision DATA_ROOT before startup.
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    group_add:
      - "${DVD_GID:-65534}"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-album_dvd}
      POSTGRES_USER: ${POSTGRES_USER:-album_dvd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-album_dvd}
      DVD_DEVICE: ${DVD_DEVICE:-/dev/sr0}
      DVD_STANDARD: ${DVD_STANDARD:-ntsc}
      DATA_ROOT: /data
      BURN_ID_PREFIX: ${BURN_ID_PREFIX:-R.P. No.}
      WEB_API_KEY: ${WEB_API_KEY:-}
      RETENTION_DELAY_HOURS: ${RETENTION_DELAY_HOURS:-3}
      WEB_PORT: 8080
    volumes:
      - "${DATA_ROOT:-/opt/album-dvd-burner}:/data"

    devices:
      - "${DVD_DEVICE:-/dev/sr0}:${DVD_DEVICE:-/dev/sr0}:rwm"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


  # Internal-only database: reachable from the web service on the default
  # compose network, never published to the host.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-album_dvd}
      POSTGRES_USER: ${POSTGRES_USER:-album_dvd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-album_dvd}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-album_dvd} -d ${POSTGRES_DB:-album_dvd}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: