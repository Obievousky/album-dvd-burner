services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-album_dvd}
      POSTGRES_USER: ${POSTGRES_USER:-album_dvd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-album_dvd}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-album_dvd} -d ${POSTGRES_DB:-album_dvd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  init-data:
    image: alpine:3.21
    user: "0:0"
    environment:
      APP_UID: ${APP_UID:-10001}
      APP_GID: ${APP_GID:-10001}
    volumes:
      - ${DATA_ROOT:-./data}:/data
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data
        chown "$$APP_UID:$$APP_GID" /data
    restart: "no"

  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      init-data:
        condition: service_completed_successfully
    # Dedicated, non-root application account. The init-data service owns /data.
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    group_add:
      - "${DVD_GID:-65534}"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-album_dvd}
      POSTGRES_USER: ${POSTGRES_USER:-album_dvd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-album_dvd}
      DVD_DEVICE: ${DVD_DEVICE:-/dev/sr0}
      DVD_STANDARD: ${DVD_STANDARD:-ntsc}
      DATA_ROOT: /data
      BURN_ID_PREFIX: ${BURN_ID_PREFIX:-R.P. No.}
      WEB_API_KEY: ${WEB_API_KEY:-}
      RETENTION_DELAY_HOURS: ${RETENTION_DELAY_HOURS:-3}
      WEB_PORT: 8080
    volumes:
      - ${DATA_ROOT:-./data}:/data
    # The app checks this path at runtime and enables burning only when a drive
    # is available inside the container.
    devices:
      - "${DVD_DEVICE:-/dev/sr0}:${DVD_DEVICE:-/dev/sr0}:rwm"
    restart: unless-stopped

volumes:
  pgdata:
