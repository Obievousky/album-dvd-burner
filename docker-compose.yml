services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-album_dvd}
      POSTGRES_USER: ${POSTGRES_USER:-album_dvd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-album_dvd}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-album_dvd} -d ${POSTGRES_DB:-album_dvd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-album_dvd}
      POSTGRES_USER: ${POSTGRES_USER:-album_dvd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-album_dvd}
      DVD_DEVICE: ${DVD_DEVICE:-/dev/sr0}
      DVD_STANDARD: ${DVD_STANDARD:-ntsc}
      DATA_ROOT: /data
      BURN_ID_PREFIX: ${BURN_ID_PREFIX:-R.P. No.}
      WEB_API_KEY: ${WEB_API_KEY:-}
      RETENTION_DELAY_HOURS: ${RETENTION_DELAY_HOURS:-3}
      WEB_PORT: 8080
    volumes:
      - ${DATA_ROOT:-./data}:/data
    devices:
      - "${DVD_DEVICE:-/dev/sr0}:${DVD_DEVICE:-/dev/sr0}"
    privileged: true
    restart: unless-stopped

volumes:
  pgdata:
